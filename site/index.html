<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LazyVim Dojo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#1a1b26; --bg2:#13141c; --bg3:#0e0e14; --hi:#24283b; --fg:#c0caf5; --dim:#7a82a8; --faint:#3b4261;
  --blue:#7aa2f7; --cyan:#7dcfff; --green:#9ece6a; --yellow:#e0af68; --orange:#ff9e64; --red:#f7768e; --mag:#bb9af7;
  --mono:"JetBrainsMono Nerd Font","JetBrains Mono","Iosevka",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg3);color:var(--fg);font:15px/1.55 var(--mono)}
a{color:var(--cyan)}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--bg2);border-bottom:1px solid var(--faint);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;color:var(--green);letter-spacing:.02em}
header h1 span{color:var(--dim);font-weight:400}
nav button{background:none;border:0;color:var(--dim);font:inherit;padding:6px 12px;cursor:pointer;border-radius:4px}
nav button.on{color:var(--bg);background:var(--blue)}
nav button:hover:not(.on){color:var(--fg)}
#prog{margin-left:auto;color:var(--dim);font-size:13px}
#prog b{color:var(--green)}
main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 55px)}
aside{background:var(--bg2);border-right:1px solid var(--faint);padding:16px 0;position:sticky;top:55px;height:calc(100vh - 55px);overflow-y:auto}
aside .l{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
aside .l:hover{background:var(--hi)}
aside .l.cur{border-left-color:var(--blue);background:var(--hi)}
aside .l small{display:block;color:var(--dim);font-size:12px}
aside .l .ck{float:right;color:var(--faint)}
aside .l.done .ck{color:var(--green)}
aside .l .bar{height:2px;background:var(--faint);margin-top:6px}
aside .l .bar i{display:block;height:2px;background:var(--green)}
section{padding:28px 44px 80px;max-width:980px}
h2{color:var(--blue);margin:0 0 4px;font-size:22px}
.sub{color:var(--dim);margin:0 0 24px}
.step{background:var(--bg);border:1px solid var(--faint);border-radius:8px;padding:16px 20px;margin:0 0 14px;transition:opacity .2s}
.step.future{opacity:.35;pointer-events:none}
.step.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.step.ok{border-color:#2f3d2a}
.step p:first-child{margin-top:0} .step p:last-child{margin-bottom:0}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.tag.k{color:var(--mag)} .tag.n{color:var(--orange)}
.say{font-size:16px;margin:0 0 10px}
kbd{display:inline-block;min-width:1.6em;padding:1px 7px;margin:0 1px;border:1px solid var(--faint);border-bottom-width:2px;border-radius:4px;background:var(--bg2);color:var(--yellow);font:13px var(--mono);text-align:center}
.keys kbd{font-size:16px;padding:3px 10px}
.typed{margin-top:12px;display:flex;align-items:center;gap:10px;min-height:34px}
.slot{display:inline-block;min-width:34px;padding:4px 8px;border:1px dashed var(--faint);border-radius:5px;text-align:center;color:var(--faint)}
.slot.hit{border:1px solid var(--green);color:var(--green)}
.slot.miss{border:1px solid var(--red);color:var(--red);animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{color:var(--dim);font-size:13px}
.see{margin-top:10px;padding:10px 14px;background:var(--bg2);border-left:3px solid var(--green);border-radius:0 6px 6px 0;display:none}
.ok .see{display:block}
.src{font-size:11px;color:var(--dim);float:right}
.src.live{color:var(--green)}
button.go{background:var(--blue);color:var(--bg);border:0;border-radius:5px;padding:7px 16px;font:inherit;cursor:pointer;margin-top:12px}
button.go.ghost{background:none;color:var(--dim);border:1px solid var(--faint)}
button.go:disabled{opacity:.4;cursor:default}
pre,code{font-family:var(--mono)}
code{color:var(--cyan)}
pre{background:var(--bg3);padding:10px 14px;border-radius:6px;color:var(--green)}
table.mini{border-collapse:collapse;margin:8px 0}
table.mini td{padding:4px 14px 4px 0;vertical-align:top}
.screen{display:grid;grid-template-columns:150px 1fr;grid-template-rows:30px 150px 26px;gap:3px;margin:14px 0;font-size:12px;max-width:620px}
.screen .z{background:var(--hi);border-radius:4px;padding:6px 10px;color:var(--fg)}
.screen small{color:var(--dim)}
.screen .bl{grid-column:1/3;background:#1f2335}
.screen .tree{background:#16161e;color:var(--blue)}
.screen .ll{grid-column:1/3;background:var(--blue);color:var(--bg)}
.done-banner{padding:16px 20px;border:1px solid var(--green);border-radius:8px;color:var(--green);margin-top:20px}
.focuscatch{position:fixed;bottom:16px;right:20px;background:var(--orange);color:var(--bg);padding:6px 12px;border-radius:5px;font-size:13px;display:none}
/* drill */
.drill{max-width:700px}
.card{background:var(--bg);border:1px solid var(--faint);border-radius:10px;padding:30px 34px;text-align:center}
.card .say{font-size:20px;margin-bottom:22px}
.card .typed{justify-content:center}
.card .ans{margin-top:16px;min-height:30px}
.stats{display:flex;gap:28px;color:var(--dim);margin:18px 0}
.stats b{color:var(--fg);font-size:18px;display:block}
.opts{color:var(--dim);font-size:13px;margin-bottom:18px}
.opts label{margin-right:16px;cursor:pointer}
/* reference */
.ref input{width:100%;background:var(--bg);border:1px solid var(--faint);color:var(--fg);font:inherit;padding:10px 14px;border-radius:6px;margin-bottom:12px}
.ref .chips button{background:var(--bg);border:1px solid var(--faint);color:var(--dim);font:12px var(--mono);padding:4px 10px;border-radius:12px;margin:0 6px 8px 0;cursor:pointer}
.ref .chips button.on{color:var(--bg);background:var(--mag);border-color:var(--mag)}
.ref table{width:100%;border-collapse:collapse;font-size:14px}
.ref td{padding:5px 10px;border-bottom:1px solid #1f2335;vertical-align:top}
.ref td:first-child{white-space:nowrap;width:1%}
.ref td.ctx{color:var(--dim);font-size:12px;white-space:nowrap}
.ref tr.taught td:nth-child(2)::after{content:" ●";color:var(--green);font-size:11px}
.ref .count{color:var(--dim);font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>LazyVim Dojo <span>· your config, your keys</span></h1>
  <nav>
    <button data-tab="course" class="on">Course</button>
    <button data-tab="drill">Drill</button>
    <button data-tab="ref">Reference</button>
  </nav>
  <div id="prog"></div>
</header>
<main id="course">
  <aside id="lessonlist"></aside>
  <section id="lesson"></section>
</main>
<main id="drill" style="display:none;grid-template-columns:1fr"><section class="drill" id="drillbox"></section></main>
<main id="ref" style="display:none;grid-template-columns:1fr"><section class="ref" id="refbox" style="max-width:1100px"></section></main>
<div class="focuscatch" id="fc">click the page to give it keyboard focus</div>
<script src="keymaps.js"></script>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
